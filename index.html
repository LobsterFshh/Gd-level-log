<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GD Completion Log</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #1a1a24;
      color: #ffffff;
      padding: 40px 20px;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    h1 {
      text-align: center;
      color: #00e5ff;
      margin-bottom: 6px;
    }
    #loggedInAs {
      text-align: center;
      font-size: 13px;
      color: #9a9cb8;
      margin-bottom: 20px;
      min-height: 18px;
    }
    #loggedInAs a {
      color: #ff4081;
      text-decoration: none;
      font-weight: bold;
    }
    #loggedInAs a:hover {
      text-decoration: underline;
    }

    /* ID panel */
    .id-panel {
      background: #252636;
      padding: 16px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .current-id {
      font-size: 22px;
      font-weight: bold;
      color: #00e5ff;
      word-break: break-all;
    }
    .current-id span.label {
      display: block;
      font-size: 11px;
      font-weight: normal;
      color: #9a9cb8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .id-switch {
      display: flex;
      gap: 8px;
    }
    .id-switch input {
      width: 140px;
      padding: 10px 12px;
      border: 1px solid #3d3f58;
      border-radius: 6px;
      background: #1a1a24;
      color: #fff;
      font-size: 14px;
    }
    .id-switch input:focus {
      outline: none;
      border-color: #00e5ff;
    }
    .id-switch button {
      padding: 10px 18px;
      background-color: #3d3f58;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 13px;
    }
    .id-switch button:hover {
      background-color: #4d4f6e;
    }
    .notice {
      font-size: 12px;
      color: #9a9cb8;
      margin: -10px 0 20px 0;
      text-align: center;
    }

    .form-card {
      background: #252636;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    .form-card h3 {
      margin-top: 0;
      color: #00e5ff;
    }
    .form-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input {
      flex: 1;
      min-width: 150px;
      padding: 12px;
      border: 1px solid #3d3f58;
      border-radius: 6px;
      background: #1a1a24;
      color: #fff;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #00e5ff;
    }
    input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    select {
      padding: 12px;
      border: 1px solid #3d3f58;
      border-radius: 6px;
      background: #1a1a24;
      color: #fff;
      font-size: 14px;
    }
    select:focus {
      outline: none;
      border-color: #00e5ff;
    }
    select:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button {
      padding: 12px 24px;
      background-color: #00e5ff;
      color: #1a1a24;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #00b3cc;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #252636;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #3d3f58;
    }
    th {
      background-color: #1f202e;
      color: #00e5ff;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .empty-row td {
      text-align: center;
      color: #6b6d8a;
      padding: 24px;
    }
    a.showcase-link {
      color: #ff4081;
      text-decoration: none;
      font-weight: bold;
    }
    a.showcase-link:hover {
      text-decoration: underline;
    }
    .delete-btn {
      background: #ff5252;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
    }
    .delete-btn:hover {
      background: #d32f2f;
    }
    #statusMsg {
      text-align: center;
      font-size: 12px;
      color: #9a9cb8;
      min-height: 16px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Geometry Dash Completion Log</h1>
    <div id="loggedInAs"></div>
    <div id="changeUsernameForm" style="display:none; text-align:center; margin-bottom:16px;">
      <input type="text" id="newUsernameInput" placeholder="New username" style="width:180px;">
      <button onclick="submitUsernameChange()">Save</button>
      <button onclick="cancelUsernameChange()">Cancel</button>
    </div>
    <div id="statusMsg"></div>

    <!-- Auth screen: shown when nobody is logged in on this device -->
    <div class="form-card" id="authCard" style="display:none;">
      <h3>Log In or Create an Account</h3>
      <div class="form-group">
        <input type="text" id="authUsername" placeholder="Username">
        <input type="password" id="authPassword" placeholder="Password">
      </div>
      <div class="form-group" style="margin-top:10px;">
        <button onclick="handleLogin()">Log In</button>
        <button onclick="handleRegister()">Register New User</button>
      </div>
    </div>

    <!-- Main app: shown once logged in -->
    <div id="appContent" style="display:none;">
      <div class="id-panel">
        <div class="current-id">
          <span class="label">Viewing</span>
          <span id="currentIdDisplay">-</span>
          <span id="currentIdSub" style="display:block; font-size:11px; font-weight:normal; color:#6b6d8a; margin-top:2px;">ID: -</span>
        </div>
        <div class="id-switch">
          <input type="text" id="idInput" placeholder="Username or ID">
          <button onclick="switchToUser()">Search</button>
        </div>
      </div>
      <p class="notice">Anyone can look up and view any user's log by username. Only the owner, logged in, can add or delete entries in their own log.</p>

      <div class="form-card">
        <div class="form-group">
          <input type="text" id="levelName" placeholder="Level Name (e.g. Bloodbath)" required>
          <select id="difficulty">
            <option value="" disabled selected>Select Difficulty</option>
            <option value="Easy">Easy</option>
            <option value="Normal">Normal</option>
            <option value="Hard">Hard</option>
            <option value="Harder">Harder</option>
            <option value="Insane">Insane</option>
            <option value="Easy Demon">Easy Demon</option>
            <option value="Medium Demon">Medium Demon</option>
            <option value="Hard Demon">Hard Demon</option>
            <option value="Insane Demon">Insane Demon</option>
            <option value="Extreme Demon">Extreme Demon</option>
          </select>
          <input type="number" id="attempts" placeholder="Attempts">
          <button onclick="addLog()" id="addLogBtn">Add Log</button>
        </div>
      </div>
      <p class="notice" id="viewOnlyNotice" style="display:none; margin-top:-10px;">🔒 Read-only — you're viewing another user's log.</p>

      <div style="display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-bottom:10px;">
        <label for="sortSelect" style="font-size:12px; color:#9a9cb8;">Sort:</label>
        <select id="sortSelect" onchange="handleSortChange()" style="min-width:200px;">
          <option value="none">Order Added</option>
          <option value="asc">Difficulty: Easy → Extreme</option>
          <option value="desc">Difficulty: Extreme → Easy</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>Level Name</th>
            <th>Difficulty</th>
            <th>Attempts</th>
            <th>Showcase</th>
            <th>🗑️</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          </tbody>
      </table>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ---- 1. PASTE YOUR FIREBASE CONFIG HERE ----
  const firebaseConfig = {
    apiKey: "AIzaSyDpVb4uBNrf6IKfpRdt7nZe1zdLsiMBeQM",
    authDomain: "gd-level-log.firebaseapp.com",
    projectId: "gd-level-log",
    storageBucket: "gd-level-log.firebasestorage.app",
    messagingSenderId: "846562077323",
    appId: "1:846562077323:web:7c65e9ea4fdbcd4534828e",
    measurementId: "G-CLVQXN3ZS1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let myUser = null;      // { username, id } for the person logged in on this device
  let viewingId = null;   // ID of the log currently displayed
  let viewingUsername = null;
  let logs = [];

  function setStatus(msg, isError) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.style.color = isError ? '#ff5252' : '#9a9cb8';
    if (msg) {
      setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 2500);
    }
  }

  function canEdit() {
    return !!(myUser && viewingId === myUser.id);
  }

  // ---- Character restrictions for usernames/passwords ----
  // Blocks: [ ] { } " ' < > : ;
  const FORBIDDEN_CHARS = /[[\]{}"'<>:;]/;

  function stripForbiddenChars(value) {
    return value.replace(/[[\]{}"'<>:;]/g, '');
  }

  function attachCharFilter(elementId) {
    const el = document.getElementById(elementId);
    el.addEventListener('input', () => {
      const cleaned = stripForbiddenChars(el.value);
      if (cleaned !== el.value) el.value = cleaned;
    });
  }

  // ---- Password hashing (client-side SHA-256) ----
  async function hashPassword(password) {
    const enc = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ---- Account creation: enforces unique username AND unique, sequential ID ----
  // Sequential ID counter lives in meta/idCounter and starts at 0, no upper bound.
  // Username uniqueness is enforced by using the lowercased username as the doc ID
  // in "usernames", combined with a transaction so two people registering the
  // same name at the same instant can't both succeed.
  async function registerUser(username, password) {
    const cleanUsername = username.trim();
    const usernameKey = cleanUsername.toLowerCase();
    if (!usernameKey) throw new Error('EMPTY_USERNAME');
    const passwordHash = await hashPassword(password);
    const usernameRef = doc(db, 'usernames', usernameKey);
    const counterRef = doc(db, 'meta', 'idCounter');

    const newId = await runTransaction(db, async (transaction) => {
      const usernameSnap = await transaction.get(usernameRef);
      if (usernameSnap.exists()) {
        throw new Error('USERNAME_TAKEN');
      }
      const counterSnap = await transaction.get(counterRef);
      const current = counterSnap.exists() ? Number(counterSnap.data().value) : -1;
      const next = current + 1;
      const nextIdStr = String(next);

      transaction.set(counterRef, { value: next });
      transaction.set(usernameRef, {
        username: cleanUsername,
        id: nextIdStr,
        passwordHash
      });
      transaction.set(doc(db, 'logs', nextIdStr), { entries: [], username: cleanUsername });

      return next;
    });

    return { username: cleanUsername, id: String(newId) };
  }

  async function loginUser(username, password) {
    const usernameKey = username.trim().toLowerCase();
    if (!usernameKey) throw new Error('EMPTY_USERNAME');
    const snap = await getDoc(doc(db, 'usernames', usernameKey));
    if (!snap.exists()) throw new Error('NO_SUCH_USER');
    const data = snap.data();
    const passwordHash = await hashPassword(password);
    if (passwordHash !== data.passwordHash) throw new Error('WRONG_PASSWORD');
    return { username: data.username, id: data.id };
  }

  // Look up which user owns a given username's log
  async function lookupUserByUsername(username) {
    const usernameKey = username.trim().toLowerCase();
    if (!usernameKey) return null;
    const snap = await getDoc(doc(db, 'usernames', usernameKey));
    if (!snap.exists()) return null;
    const data = snap.data();
    return { username: data.username, id: data.id };
  }

  // Fixed difficulty tier order, easiest to hardest
  const DIFFICULTY_ORDER = ['easy', 'normal', 'hard', 'harder', 'insane', 'easy demon', 'medium demon', 'hard demon', 'insane demon', 'extreme demon'];
  let sortMode = 'none'; // 'none' | 'asc' | 'desc'

  function difficultyRank(difficulty) {
    const idx = DIFFICULTY_ORDER.indexOf((difficulty || '').toLowerCase());
    return idx === -1 ? DIFFICULTY_ORDER.length : idx;
  }

  function handleSortChange() {
    sortMode = document.getElementById('sortSelect').value;
    renderTable();
  }

  // ---- AREDL placement lookup ----
  // NOTE: AREDL's public docs page is a JS app I couldn't fully inspect, so
  // this endpoint/response parsing is a best-effort guess at their REST
  // shape. If placements come back wrong, this is the one spot to fix —
  // check the Network tab on aredl.net while searching a level, then adjust
  // the URL/field names below.
  const AREDL_API_BASE = 'https://api.aredl.net/v2';

  async function fetchAredlPlacement(levelName) {
    const url = `${AREDL_API_BASE}/api/levels?name=${encodeURIComponent(levelName)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('AREDL request failed: ' + res.status);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.data || data.levels || data.results || []);
    if (!list || !list.length) return null;
    const match = list.find(lvl => (lvl.name || '').toLowerCase() === levelName.toLowerCase()) || list[0];
    return match.placement ?? match.position ?? match.rank ?? null;
  }

  // Fetches the live AREDL placement for one row and patches just that cell,
  // so the number shown is always current without blocking the table render.
  async function updateAredlPlacement(rowIndex, levelName) {
    const cell = document.getElementById(`diff-cell-${rowIndex}`);
    if (!cell) return;
    try {
      const placement = await fetchAredlPlacement(levelName);
      if (!document.body.contains(cell)) return;
      cell.textContent = placement ? `AREDL #${placement}` : 'Extreme Demon — not on AREDL';
    } catch (e) {
      console.error('AREDL lookup failed:', e);
      if (document.body.contains(cell)) cell.textContent = 'Extreme Demon (AREDL lookup failed)';
    }
  }

  function renderTable() {
    const tbody = document.getElementById('logTableBody');
    tbody.innerHTML = '';

    if (logs.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="5">No logs yet for this user. Add your first one above.</td></tr>`;
      return;
    }

    const editable = canEdit();

    // Sort by difficulty tier for display only — data order in Firestore is untouched
    const order = logs.map((_, i) => i);
    if (sortMode !== 'none') {
      order.sort((a, b) => {
        const diff = difficultyRank(logs[a].difficulty) - difficultyRank(logs[b].difficulty);
        return sortMode === 'asc' ? diff : -diff;
      });
    }

    const extremeDemonRows = [];

    order.forEach((index) => {
      const log = logs[index];
      const searchQuery = encodeURIComponent(`${log.levelName} showcase`);
      const youtubeUrl = `https://www.youtube.com/results?search_query=${searchQuery}`;
      const deleteCell = editable
        ? `<button class="delete-btn" data-index="${index}">Delete</button>`
        : '';
      const isExtremeDemon = (log.difficulty || '').toLowerCase() === 'extreme demon';
      const difficultyCell = isExtremeDemon
        ? `<span id="diff-cell-${index}">Checking AREDL…</span>`
        : log.difficulty;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td><strong>${log.levelName}</strong></td>
        <td>${difficultyCell}</td>
        <td>${log.attempts}</td>
        <td><a class="showcase-link" href="${youtubeUrl}" target="_blank" rel="noopener noreferrer"> YT
        Showcase↗</a></td>
        <td>${deleteCell}</td>
      `;
      tbody.appendChild(row);

      if (isExtremeDemon) {
        extremeDemonRows.push({ index, levelName: log.levelName });
      }
    });

    tbody.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteLog(Number(btn.dataset.index)));
    });

    // Fetch each Extreme Demon's live AREDL placement without blocking the render
    extremeDemonRows.forEach(({ index, levelName }) => {
      updateAredlPlacement(index, levelName);
    });
  }

  function updateEditPermissions() {
    const editable = canEdit();
    document.getElementById('levelName').disabled = !editable;
    document.getElementById('difficulty').disabled = !editable;
    document.getElementById('attempts').disabled = !editable;
    document.getElementById('addLogBtn').disabled = !editable;
    document.getElementById('viewOnlyNotice').style.display = editable ? 'none' : 'block';
  }

  // ---- Firestore read/write for the entries list ----
  async function loadLogsForId(id) {
    setStatus('Loading...');
    try {
      const snap = await getDoc(doc(db, 'logs', id));
      logs = snap.exists() ? (snap.data().entries || []) : [];
      setStatus('');
    } catch (e) {
      console.error('Firestore error:', e);
      logs = [];
      setStatus('Could not load that log', true);
    }
    renderTable();
  }

  async function saveLogsForId(id) {
    try {
      await setDoc(doc(db, 'logs', id), { entries: logs, username: viewingUsername }, { merge: true });
    } catch (e) {
      console.error('Firestore error:', e);
      setStatus('Save failed, try again', true);
    }
  }

  function updateViewingDisplay(username, id) {
    document.getElementById('currentIdDisplay').textContent = username;
    document.getElementById('currentIdSub').textContent = 'ID: ' + id;
  }

  // Look up which user owns a given ID's log, by ID
  async function lookupUserById(id) {
    const snap = await getDoc(doc(db, 'logs', id));
    if (!snap.exists() || !snap.data().username) return null;
    return { username: snap.data().username, id };
  }

  async function revertToOwnLog() {
    if (!myUser) return;
    viewingId = myUser.id;
    viewingUsername = myUser.username;
    updateViewingDisplay(viewingUsername, viewingId);
    document.getElementById('idInput').value = '';
    await loadLogsForId(viewingId);
    updateEditPermissions();
  }

  async function switchToUser() {
    const input = document.getElementById('idInput');
    const typed = input.value.trim();
    if (typed === '') {
      alert('Please enter a username or ID to load!');
      return;
    }

    setStatus('Looking up user...');
    // Pure digits -> treat as an ID lookup, otherwise treat as a username lookup
    const found = /^\d+$/.test(typed)
      ? await lookupUserById(typed)
      : await lookupUserByUsername(typed);

    if (!found) {
      setStatus('No user name found', true);
      setTimeout(revertToOwnLog, 1000);
      return;
    }

    viewingId = found.id;
    viewingUsername = found.username;
    updateViewingDisplay(viewingUsername, viewingId);

    await loadLogsForId(viewingId);
    updateEditPermissions();
    setStatus(`Viewing ${viewingUsername}'s log`);
  }

  async function addLog() {
    if (!canEdit()) return;

    const levelInput = document.getElementById('levelName');
    const diffInput = document.getElementById('difficulty');
    const attInput = document.getElementById('attempts');

    const levelName = levelInput.value.trim();
    const difficulty = diffInput.value;
    const attempts = attInput.value.trim() || 'N/A';

    if (levelName === '') {
      alert('Please enter a level name!');
      return;
    }
    if (difficulty === '') {
      alert('Please select a difficulty!');
      return;
    }

    logs.push({ levelName, difficulty, attempts });
    renderTable();
    await saveLogsForId(viewingId);
    setStatus('Log saved');

    levelInput.value = '';
    diffInput.value = '';
    attInput.value = '';
  }

  async function deleteLog(index) {
    if (!canEdit()) return;
    logs.splice(index, 1);
    renderTable();
    await saveLogsForId(viewingId);
    setStatus('Log removed');
  }

  // ---- Auth screen handlers ----
  async function handleRegister() {
    const username = document.getElementById('authUsername').value;
    const password = document.getElementById('authPassword').value;
    if (!username.trim() || !password) {
      setStatus('Enter a username and password', true);
      return;
    }
    if (FORBIDDEN_CHARS.test(username) || FORBIDDEN_CHARS.test(password)) {
      setStatus('Username/password can\'t contain [ ] { } " \' < > : ;', true);
      return;
    }
    setStatus('Creating account...');
    try {
      const result = await registerUser(username, password);
      await completeLogin(result);
      setStatus('Account created! Welcome, ' + result.username);
    } catch (e) {
      if (e.message === 'USERNAME_TAKEN') {
        setStatus('That username is already taken', true);
      } else {
        console.error(e);
        setStatus('Could not create account', true);
      }
    }
  }

  async function handleLogin() {
    const username = document.getElementById('authUsername').value;
    const password = document.getElementById('authPassword').value;
    if (!username.trim() || !password) {
      setStatus('Enter a username and password', true);
      return;
    }
    if (FORBIDDEN_CHARS.test(username) || FORBIDDEN_CHARS.test(password)) {
      setStatus('Username/password can\'t contain [ ] { } " \' < > : ;', true);
      return;
    }
    setStatus('Logging in...');
    try {
      const result = await loginUser(username, password);
      await completeLogin(result);
      setStatus('Welcome back, ' + result.username);
    } catch (e) {
      if (e.message === 'NO_SUCH_USER') {
        setStatus('No account with that username — try Register', true);
      } else if (e.message === 'WRONG_PASSWORD') {
        setStatus('Incorrect password', true);
      } else {
        console.error(e);
        setStatus('Could not log in', true);
      }
    }
  }

  function renderLoggedInAs() {
    const el = document.getElementById('loggedInAs');
    if (myUser) {
      el.innerHTML = `Logged in as <strong>${myUser.username}</strong> &middot; <a href="#" id="changeUsernameLink">Change Username</a> &middot; <a href="#" id="logoutLink">Log out</a>`;
      document.getElementById('changeUsernameLink').addEventListener('click', (e) => {
        e.preventDefault();
        toggleChangeUsernameForm(true);
      });
      document.getElementById('logoutLink').addEventListener('click', (e) => {
        e.preventDefault();
        logout();
      });
    } else {
      el.innerHTML = '';
      toggleChangeUsernameForm(false);
    }
  }

  function toggleChangeUsernameForm(show) {
    document.getElementById('changeUsernameForm').style.display = show ? 'inline-block' : 'none';
    if (show) document.getElementById('newUsernameInput').value = '';
  }

  function cancelUsernameChange() {
    toggleChangeUsernameForm(false);
  }

  // Renames a user's account: moves the usernames/{key} doc to the new key,
  // keeps the same ID and password, and updates the denormalized username on
  // their logs doc. All done in one transaction so it can't collide with
  // someone else registering the new name at the same time.
  async function changeUsername(newUsername) {
    const oldKey = myUser.username.toLowerCase();
    const newKey = newUsername.toLowerCase();
    const oldRef = doc(db, 'usernames', oldKey);
    const newRef = doc(db, 'usernames', newKey);
    const logRef = doc(db, 'logs', myUser.id);

    await runTransaction(db, async (transaction) => {
      const newSnap = await transaction.get(newRef);
      if (newSnap.exists()) {
        throw new Error('USERNAME_TAKEN');
      }
      const oldSnap = await transaction.get(oldRef);
      const oldData = oldSnap.exists() ? oldSnap.data() : { passwordHash: null };

      transaction.set(newRef, {
        username: newUsername,
        id: myUser.id,
        passwordHash: oldData.passwordHash
      });
      transaction.delete(oldRef);
      transaction.set(logRef, { username: newUsername }, { merge: true });
    });

    myUser.username = newUsername;
    try {
      localStorage.setItem('myUser', JSON.stringify(myUser));
    } catch (e) {
      console.error('localStorage error:', e);
    }
    renderLoggedInAs();
    if (viewingId === myUser.id) {
      viewingUsername = newUsername;
      updateViewingDisplay(viewingUsername, viewingId);
    }
  }

  async function submitUsernameChange() {
    const raw = document.getElementById('newUsernameInput').value;
    const cleanNew = raw.trim();
    if (!cleanNew) {
      setStatus('Enter a new username', true);
      return;
    }
    if (FORBIDDEN_CHARS.test(cleanNew)) {
      setStatus('Username can\'t contain [ ] { } " \' < > : ;', true);
      return;
    }
    if (cleanNew.toLowerCase() === myUser.username.toLowerCase()) {
      setStatus('That\'s already your username', true);
      return;
    }
    setStatus('Updating username...');
    try {
      await changeUsername(cleanNew);
      toggleChangeUsernameForm(false);
      setStatus('Username updated!');
    } catch (e) {
      if (e.message === 'USERNAME_TAKEN') {
        setStatus('That username is already taken', true);
      } else {
        console.error(e);
        setStatus('Could not update username', true);
      }
    }
  }


  async function completeLogin(user) {
    myUser = user;
    try {
      localStorage.setItem('myUser', JSON.stringify(user));
    } catch (e) {
      console.error('localStorage error:', e);
    }

    document.getElementById('authUsername').value = '';
    document.getElementById('authPassword').value = '';
    document.getElementById('authCard').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    renderLoggedInAs();

    viewingId = myUser.id;
    viewingUsername = myUser.username;
    updateViewingDisplay(viewingUsername, viewingId);
    document.getElementById('idInput').value = '';

    await loadLogsForId(viewingId);
    updateEditPermissions();
  }

  function logout() {
    myUser = null;
    viewingId = null;
    viewingUsername = null;
    logs = [];
    try {
      localStorage.removeItem('myUser');
    } catch (e) {
      console.error('localStorage error:', e);
    }
    document.getElementById('appContent').style.display = 'none';
    document.getElementById('authCard').style.display = 'block';
    renderLoggedInAs();
    setStatus('Logged out');
  }

  async function init() {
    let saved = null;
    try {
      const raw = localStorage.getItem('myUser');
      saved = raw ? JSON.parse(raw) : null;
    } catch (e) {
      saved = null;
    }

    if (saved && saved.username && saved.id) {
      myUser = saved;
      document.getElementById('authCard').style.display = 'none';
      document.getElementById('appContent').style.display = 'block';
      renderLoggedInAs();

      viewingId = myUser.id;
      viewingUsername = myUser.username;
      updateViewingDisplay(viewingUsername, viewingId);

      await loadLogsForId(viewingId);
      updateEditPermissions();
    } else {
      document.getElementById('authCard').style.display = 'block';
      document.getElementById('appContent').style.display = 'none';
    }
  }

  // expose the functions the inline HTML onclick handlers need
  window.handleLogin = handleLogin;
  window.handleRegister = handleRegister;
  window.switchToUser = switchToUser;
  window.addLog = addLog;
  window.handleSortChange = handleSortChange;
  window.submitUsernameChange = submitUsernameChange;
  window.cancelUsernameChange = cancelUsernameChange;

  attachCharFilter('authUsername');
  attachCharFilter('authPassword');

  init();
</script>

</body>
</html>
